<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TJ Collamore</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">  
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
  <header>
    <div class="container">
    <div class="title-group">
      <h1 id="page-title">TJ Collamore</h1>
      <p id="page-tagline">Cross-country captain and creator, driven by curiosity and purpose.</p>
    </div>
      <nav>
        <ul>
          <li>
            <button data-tab="about" class="nav-btn active">
              <i class="fa-regular fa-address-card"></i> About
            </button>
          </li>
          <li>
            <button data-tab="projects" class="nav-btn">
              <i class="fa-solid fa-briefcase"></i> Projects
            </button>
          </li>
          <li>
            <button data-tab="experiences" class="nav-btn">
              <i class="fa-solid fa-heart-pulse"></i> Experiences
            </button>
          </li>
          <li>
            <button data-tab="essays" class="nav-btn">
              <i class="fa-solid fa-book"></i> Essays
            </button>
          </li>
        </ul>
      </nav>
    </div>
  </header>
  <main class="container">
    <section id="about" class="tab active">Loading…</section>
    <section id="projects" class="tab">Loading…</section>
    <section id="experiences" class="tab">Loading…</section>
    <section id="essays" class="tab">
      <div class="container">
        <h2>Essays & Research Papers</h2>
        <div id="essays-list" class="essay-grid"></div>
      </div>
    </section>
  </main>
  <!-- Global Modal for Essays -->
  <div id="pdf-modal">
    <div class="pdf-modal-content">
      <span class="modal-close" onclick="closePdfModal()">&times;</span>
      <div id="pdf-viewer-body"></div>
    </div>
  </div>
  <script src="assets/js/script.js"></script>
</body>
</html>
